<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/fairly_favicon_pink.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fairly</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Special+Gothic+Expanded+One&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- App container -->
  <main class="app">

    <!-- Header -->
    <header class="app-header">
      <h1>Fairly</h1>
      <img src="/fairly_logotyp.jpg" alt="Fairly logotyp" class="app-logo" />
    </header>

    <!-- Personer / inställningar -->
    <section class="persons">
      <h2>Lägg till personer</h2>

      <div class="person-cards">

        <div class="person-card">
          <h3>Person A</h3>
          <label>
            Namn
            <input type="text" id="personA-name" />
          </label>
          <label>
            Inkomst
            <input type="number" id="personA-income" />
          </label>
        </div>

        <div class="person-card">
          <h3>Person B</h3>
          <label>
            Namn
            <input type="text" id="personB-name" />
          </label>
          <label>
            Inkomst
            <input type="number" id="personB-income" />
          </label>
        </div>

      </div>
    </section>

    <!-- Lägg till utgift -->
    <section class="add-expense">
      <h2>Lägg till utgift</h2>

      <form id="expense-form">
        <label>
          Belopp
          <input type="number" id="expense-amount" required />
        </label>

        <label>
          Beskrivning
          <input type="text" id="expense-description" required />
        </label>

        <label>
          Kategori
          <select id="expense-category">
            <option value="">Välj kategori</option>
            <!-- Renderas via JavaScript -->
          </select>
        </label>

        <fieldset class="radio-group">
          <legend>Vem betalade?</legend>
          <label class="radio-option">
            <input type="radio" name="paidBy" value="A" />
            <span id="radio-personA">Person A</span>
          </label>

          <label class="radio-option">
            <input type="radio" name="paidBy" value="B" />
            <span id="radio-personB">Person B</span>
          </label>

        </fieldset>


        <button type="submit">Lägg till</button>
      </form>
    </section>

    <!-- Budgetposter -->
    <section class="budget-posts">
      <h2>Sammanlagda utgifter</h2>

      <ul id="posts-list">
        <!-- Renderas via JavaScript -->
      </ul>
    </section>

    <!-- Sammanställning -->
    <section class="summary">
      <h2>Sammanställning</h2>

      <p>Totala inkomster: <span id="total-income">0 kr</span></p>
      <p>Totala utgifter: <span id="total-expense">0 kr</span></p>

      <p class="balance">
        Balans: <span id="balance-amount">0 kr</span>
      </p>

      <hr />

     <p>Total utgift <span id="personA-label">Person A</span><span id="personA-total">0 kr</span></p>
<p>Total utgift <span id="personB-label">Person B</span><span id="personB-total">0 kr</span></p>

     <div id="percentage-container">
<label for="split-percentage">
  Hur stor del ska <span id="personA-label-2">Person A</span> betala?
</label>
  <input type="number" id="split-percentage" value="50" min="0" max="100" />
</div>
     
     
      <div class="split-modes">

  <label class="split-option">
    <input type="radio" name="splitMode" value="percentage" checked>
    Procentfördelning
  </label>

  <label class="split-option">
    <input type="radio" name="splitMode" value="equalIncome">
    Lika mycket kvar (baserat på individuell inkomst)
  </label>

  <label class="split-option">
    <input type="radio" name="splitMode" value="sharedPool">
    Gemensam ekonomi (lika kvar från total inkomst)
  </label>

</div>

      <p class="resultat-headline">Resultat:</p>
      <p class="result" id="settlement-result">
        <!-- Swish-resultat via JS -->
      </p>

      <p class="remaining">
        Kvar efter utgifter:
      </p>
      <p>
        <span id="personA-remaining">0</span>
        <span id="personB-remaining">0</span>
      </p>
    </section>


    <footer class="app-footer">
      <p>Copyright @Jennie Modd</p>
    </footer>

  </main>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
